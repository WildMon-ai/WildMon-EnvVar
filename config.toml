# =====================================================================
# 🌍 Google Earth Engine configuration
# =====================================================================

GEE_PROJECT_ID = "wide-office-411000"


# =====================================================================
# 📥 Input data configuration
# =====================================================================

LOCATIONS_CSV_PATH = "input/locations.csv"
LAT_COLUMN_NAME = "latitude"
LON_COLUMN_NAME = "longitude"


# =====================================================================
# 🗺️ Spatial sampling & AOI settings
# =====================================================================

HEXAGRID_RESOLUTION = 5                 # H3 hexagon resolution
SAMPLING_POINT_BUFFER_METERS = 200      # Buffer around each point for sampling statistics
AOI_BUFFER_KM = 30                      # Buffer added around all points to define AOI 


# =====================================================================
# 🛰️ Image/time window configuration
# =====================================================================

IMAGE_START_DATE = "2025-01-01"
IMAGE_END_DATE   = "2025-12-31"


# =====================================================================
# 💧 Water distance analysis
# =====================================================================

MAX_SEARCH_DISTANCE_M_WATERDIST = 20000   # Max search radius for distance-to-water (meters)


# =====================================================================
# 🔐 Optional: Service account authentication
# =====================================================================

# SERVICE_ACCOUNT = "service-account@google-cloud-project.iam.gserviceaccount.com"
# SERVICE_ACCOUNT_KEY_FILE = "/abs/path/to/service-account-key.json"


